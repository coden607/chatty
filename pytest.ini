[pytest]
# Unit tests only. Root-level test_*.py scripts that hit live APIs
# (test_nvidia_real, test_openai, test_real_integrations, test_unified_ai_systems,
# test_cole_medin, test_youtube_learner) are manual scripts: run them directly.
testpaths =
    tests
    test_system_integration.py
    test_adaptive_orchestration_router.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
